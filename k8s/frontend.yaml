apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: autosre-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: python:3.11-slim
        command: ["python","-c","from http.server import HTTPServer,SimpleHTTPRequestHandler; HTTPServer(('0.0.0.0',8000),SimpleHTTPRequestHandler).serve_forever()"]
        ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: autosre-demo}
spec:
  selector: {app: frontend}
  ports: [{port: 8000, targetPort: 8000}]
